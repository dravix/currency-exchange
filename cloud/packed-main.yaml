AWSTemplateFormatVersion: 2010-09-09
Description: Top-level stack template that deploys all the application resources including
  nested stacks.
Parameters:
  BanxicoApiToken:
    Description: Banxico API Token for Currency Exchange application
    Type: String
    NoEcho: true
  Namespace:
    Description: Namespace for the application, used for resource naming and tagging
    Type: String
    Default: ce-dev
Resources:
  BanxicoApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Banxico API Token for Currency Exchange application
      Name: BANXICO_API_TOKEN
      SecretString:
        Ref: BanxicoApiToken
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-2.amazonaws.com/currency-exchange-s3-cfn-templates-869457277268/50358926ba5b2f538bc231a9cc38abee.template
      Parameters:
        Namespace:
          Ref: Namespace
  ECSFrontendStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
    - VPCStack
    Properties:
      TemplateURL: https://s3.us-east-2.amazonaws.com/currency-exchange-s3-cfn-templates-869457277268/a1ab6c454f0169b6b21e8540220d8328.template
      Parameters:
        Namespace:
          Ref: Namespace
        ServiceName: FrontendService
        ImageUrl: 869457277268.dkr.ecr.us-east-1.amazonaws.com/currency-exchange:frontend-v0.1.2
        ContainerPort: 80
        ContainerCpu: '256'
        ContainerMemory: '512'
        Environment:
        - Name: DB_HOST
          Value: currency-exchange-infra-rdsstack-1bzxxoiy15-maindb-af53ofacnqdy.ck18kwcwcgb8.us-east-1.rds.amazonaws.com
        - Name: BACKEND_HOST
          Value:
            Fn::Sub: ${VPCStack.Outputs.InternalVip}
  ECSBackendStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
    - VPCStack
    Properties:
      TemplateURL: https://s3.us-east-2.amazonaws.com/currency-exchange-s3-cfn-templates-869457277268/a1ab6c454f0169b6b21e8540220d8328.template
      Parameters:
        Namespace:
          Ref: Namespace
        ServiceName: BackendService
        ImageUrl: 869457277268.dkr.ecr.us-east-1.amazonaws.com/currency-exchange:backend-v0.1.0
        ContainerPort: 3000
        ContainerCpu: '256'
        ContainerMemory: '512'
        Environment:
        - Name: DB_HOST
          Value: currency-exchange-infra-rdsstack-1bzxxoiy15-maindb-af53ofacnqdy.ck18kwcwcgb8.us-east-1.rds.amazonaws.com
        - Name: DB_USER
          Value: admin
        - Name: DB_PASSWORD
          Value: EC3cOtDNOJhezcBCL2BN
        - Name: DB_NAME
          Value: CurrencyExchangeDB
        - Name: PORT
          Value: '3000'
        - Name: DB_PORT
          Value: '3306'
        - Name: BANXICO_API_TOKEN
          Value: 6f28a64d52d3adf0acc05bb1b741fc2ab7c776d761863b281169de233822d5da
