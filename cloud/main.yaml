AWSTemplateFormatVersion: 2010-09-09
Description: Top-level stack template that deploys all the application resources including nested stacks.

Parameters:
  BanxicoApiToken:
    Description: Banxico API Token for Currency Exchange application
    Type: String
    NoEcho: true

  Namespace:
    Description: Namespace for the application, used for resource naming and tagging
    Type: String
    Default: ce-dev

  
  EmailNotification:
    Description: Email address to receive alarm notifications
    Type: String
    Default: '--EMAIL_ADDRESS--' # Replace with your email address

Resources:

  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./ecs_cluster.yaml
      Parameters:
        Namespace: !Ref Namespace
        VPCName: !Sub '${Namespace}-VPC'

  RDSStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./rds.yaml
      Parameters:
        DBName: CurrencyExchangeDB
        DBUser: ceadmin
        DBAllocatedStorage: "5"
        DBInstanceClass: db.t3.small
        ECSSecurityGroup: !GetAtt VPCStack.Outputs.FargateContainerSecurityGroup
        MultiAZ: "false"
        EnableReadReplica: "false"

  # ECRRepositoryStack:
  #   Type: AWS::CloudFormation::Stack
  #   Properties:
  #     TemplateURL: ./ecr.yaml

  ECSFrontendStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: 
      - VPCStack
      # - ECRRepositoryStack
    Properties:
      TemplateURL: ./ecs_frontend.yaml
      Parameters:
        Namespace: !Ref Namespace
        ServiceName: CE-Frontend
        ImageUrl: 
          Fn::ImportValue: !Sub '${Namespace}:ECRRepositoryUri:frontend-latest'
        ContainerPort: 80
        ContainerCpu: '256'
        ContainerMemory: '512'
        Path: '*'
        Priority: 10
        DesiredCount: 2 


  ECSBackendStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: 
      - VPCStack
      # - ECRRepositoryStack
      - RDSStack
    Properties:
      TemplateURL: ./ecs_backend.yaml
      Parameters:
        Namespace: !Ref Namespace
        ServiceName: CE-Backend
        ImageUrl: 
            Fn::ImportValue: !Sub '${Namespace}:ECRRepositoryUri:backend-latest'
        ContainerPort: 3000
        ContainerCpu: '256'
        ContainerMemory: '512'
        PublicPath: '/api/(currencies|health|rates).*'
        PrivatePath: '/api.*'
        Priority: 1
        DesiredCount: 2
        BanxicoApiToken: !Ref BanxicoApiToken


  LambdaSyncStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: 
      - ECSBackendStack
    Properties:
      TemplateURL: ./lambda_sync.yaml
      Parameters:
        Namespace: !Ref Namespace


  CloudWatchStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: 
      - ECSBackendStack
      - ECSFrontendStack
      - LambdaSyncStack
    Properties:
      TemplateURL: ./cloudwatch.yaml
      Parameters:
        Namespace: !Ref Namespace
        Email: !Ref EmailNotification

