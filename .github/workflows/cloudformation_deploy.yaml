name: Deploy CloudFormation Stack

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - integration
          - production

      region:
        description: 'AWS Region'
        required: true
        type: choice
        default: us-east-1
        options:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
    
      - name: Checkout code
        uses: actions/checkout@v3 

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Deploy CFN ECR Stack with github action role
        uses: aws-actions/aws-cloudformation-github-deploy@v2.0.0
        with:
          name: currency-exchange-ecr-${{ github.event.inputs.environment }}
          template: cloud/ecr.yaml
          parameter-overrides: |
            Namespace=${{ github.event.inputs.environment }}
          capabilities: CAPABILITY_NAMED_IAM

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if backend image exists
        id: check-be-image-exists
        uses: tyriis/docker-image-tag-exists@v2.1.0
        with:
          registry: ${{ steps.login-ecr.outputs.registry }}
          repository: currency-exchange
          tag: backend-latest

      - name: Build Backend Docker image, tag and push it to Amazon ECR
        if: ${{ steps.check-be-image-exists.outputs.tag != 'found' }}
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: currency-exchange
          IMAGE_TAG: backend-latest
        run: |
          cd backend/
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Check if frontend image exists
        id: check-fe-image-exists
        uses: tyriis/docker-image-tag-exists@v2.1.0
        with:
          registry: ${{ steps.login-ecr.outputs.registry }}
          repository: currency-exchange
          tag: frontend-latest

      - name: Build Frontend Docker image, tag and push it to Amazon ECR
        if: ${{ steps.check-fe-image-exists.outputs.tag != 'found' }}
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: currency-exchange
          IMAGE_TAG: frontend-latest
        run: |
          cd frontend/
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Deploy CFN VPC, ELB and ECS Clusters Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2.0.0
        with:
          name: currency-exchange-vpc-${{ github.event.inputs.environment }}
          template: cloud/ecs_cluster.yaml
          parameter-overrides: >-
            Namespace=${{ github.event.inputs.environment }},
            VPCName=${{ github.event.inputs.environment }}-VPC
          capabilities: CAPABILITY_NAMED_IAM
      
      - name: Deploy CFN RDS Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2.0.0
        with:
          name: currency-exchange-rds-${{ github.event.inputs.environment }}
          template: cloud/rds.yaml
          parameter-overrides: >-
            Namespace=${{ github.event.inputs.environment }},
            DBName=CurrencyExchangeDB,
            DBUser=ceadmin,
            DBAllocatedStorage=5,
            DBInstanceClass=db.t3.small,
            MultiAZ=false,
            EnableReadReplica=false
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy CFN Frontend ECS Service Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2.0.0
        with:
          name: currency-exchange-frontend-${{ github.event.inputs.environment }}
          template: cloud/ecs_frontend.yaml
          parameter-overrides: >-
            Namespace=${{ github.event.inputs.environment }},
            ServiceName=CE-Frontend,
            ImageUrl=${{ steps.login-ecr.outputs.registry }}/currency-exchange:frontend-latest,
            ContainerPort=80,
            ContainerCpu=256,
            ContainerMemory=512,
            Priority=10,
            DesiredCount=2
          capabilities: CAPABILITY_NAMED_IAM

      - name: Deploy CFN Backend ECS Service Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2.0.0
        with:
          name: currency-exchange-backend-${{ github.event.inputs.environment }}
          template: cloud/ecs_backend.yaml
          parameter-overrides: >-
            Namespace=${{ github.event.inputs.environment }},
            ServiceName=CE-Backend,
            ImageUrl=${{ steps.login-ecr.outputs.registry }}/currency-exchange:backend-latest,
            ContainerPort=3000,
            ContainerCpu=256,
            ContainerMemory=512,
            Priority=1,
            DesiredCount=2,
            BanxicoApiToken=${{ secrets.BANXICO_API_TOKEN }}
          capabilities: CAPABILITY_NAMED_IAM  

      - name: Deploy CFN Lambda Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2.0.0
        with:
          name: currency-exchange-lambda-${{ github.event.inputs.environment }}
          template: cloud/lambda.yaml
          parameter-overrides: >-
            Namespace=${{ github.event.inputs.environment }}
          capabilities: CAPABILITY_NAMED_IAM

      - name: Invoke Lambda Sync Function
        run: |
          aws lambda invoke \
            --function-name ${{ github.event.inputs.environment }}-SyncFunction \
            --region ${{ github.event.inputs.region }} \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action": "sync"}' \
            response.json
          cat response.json

      - name: Deploy CFN CloudWatch Alarms Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2.0.0
        with:
          name: currency-exchange-cloudwatch-${{ github.event.inputs.environment }}
          template: cloud/cloudwatch.yaml
          parameter-overrides: >-
            Namespace=${{ github.event.inputs.environment }},
            Email=${{ vars.EMAIL_NOTIFICATION }}
          capabilities: CAPABILITY_NAMED_IAM 

      - name: Expose Application URL
        run: aws cloudformation list-exports|yq '.Exports[]| select(.Name == "${{ github.event.inputs.environment }}:ExternalVip")|"http://" + .Value'